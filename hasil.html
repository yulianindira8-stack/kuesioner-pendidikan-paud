
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hasil Kuesioner 💌</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()">🌙</button>

  <main class="container">
    <div class="top-banner"></div>

    <section class="card result-card">
      <div class="emoji-big" id="resultEmoji">💌</div>
      <h1 id="resultTitle">Terima Kasih!</h1>
      <p id="resultMessage" class="result-message">
        Jawaban kamu sudah selesai diisi.
      </p>
      <p id="resultName" class="subtitle"></p>

      <button class="primary-btn" onclick="restartForm()">
        Isi Ulang 🔄
      </button>
    </section>

    <p class="footer">Kuesioner Pendidikan • Dibuat dengan ❤️</p>
  </main>
</body>
</html>
